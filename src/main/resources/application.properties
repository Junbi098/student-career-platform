spring.application.name=student-career-platform
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

# Local generated settings are ignored by Git. Standard SPRING_DATASOURCE_* environment variables override them.
spring.config.import=optional:file:./.local/database.properties
spring.datasource.url=jdbc:postgresql://127.0.0.1:15432/student_career
spring.datasource.username=student_career
spring.datasource.password=${STUDENT_CAREER_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

# Fictional imports must be explicitly enabled, e.g. in an isolated demo environment.
app.demo.enabled=false
